# --- Display Core Metrics ---
fps
frametime
fps_metrics=avg,0.01
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
cpu_stats
cpu_temp
cpu_power
ram
vram

# --- Formatting & Layout ---
# horizontal is off by default, so it's omitted
hud_no_margin
font_size=24
round_corners=10
background_alpha=0.4
alpha=0.9
position=top-left

# --- Colors (Hex) ---
text_color=FFFFFF
gpu_color=2ecc71
cpu_color=3498db
fps_color=f1c40f
ram_color=e67e22

# --- Limits & Shortcuts ---
# fps_limit=60
toggle_hud=Shift_R+F12
